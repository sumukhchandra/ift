# ==============================================================================
# Render Blueprint Specification for AlphaNSE V3 Cloud Deployment
#
# Architecture:
# 1. alphanse-v3-dashboard: Streamlit Web Service (Mobile-friendly UI)
# 2. alphanse-v3-worker: Continuous Background Worker (Engine)
# 3. alphanse-v3-db: Managed PostgreSQL Database (Durable cross-service persistence)
#
# Plan / Pricing Disclosure:
# - Web Service: Runs on 'free' (or 'starter' for 0 cold starts)
# - Background Worker: Requires 'starter' ($7/mo) because Render does not permit
#   free-tier background workers (free web services sleep after 15m inactivity).
# - Managed PostgreSQL: 'free' (90-day duration) or 'starter' ($7/mo) for permanent.
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. Mobile Monitoring Web Dashboard (Streamlit)
  # ----------------------------------------------------------------------------
  - type: web
    name: alphanse-v3-dashboard
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: alphanse-v3-db
          property: connectionString
      - key: LIVE_TRADING
        value: "False"
      - key: ALLOW_REAL_ORDERS
        value: "False"
      - key: MAX_CAPITAL_ALLOCATED
        value: "1500.00"
      - key: MAX_DAILY_LOSS
        value: "30.00"
      - key: MAX_OPEN_POSITIONS
        value: "1"

  # ----------------------------------------------------------------------------
  # 2. Continuous Background Worker (Live Trading Engine)
  # ----------------------------------------------------------------------------
  - type: worker
    name: alphanse-v3-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run_live_trader.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: alphanse-v3-db
          property: connectionString
      - key: LIVE_TRADING
        value: "False"
      - key: ALLOW_REAL_ORDERS
        value: "False"
      - key: MAX_CAPITAL_ALLOCATED
        value: "1500.00"
      - key: MAX_DAILY_LOSS
        value: "30.00"
      - key: MAX_OPEN_POSITIONS
        value: "1"
      - key: CASH_ONLY
        value: "True"
      # Kotak Neo Broker Credentials (Set securely in Render Environment Settings)
      - key: KOTAK_CONSUMER_KEY
        sync: false
      - key: KOTAK_MOBILE_NUMBER
        sync: false
      - key: KOTAK_UCC
        sync: false
      - key: KOTAK_MPIN
        sync: false
      - key: KOTAK_TOTP_SECRET
        sync: false

# ------------------------------------------------------------------------------
# 3. Persistent PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: alphanse-v3-db
    plan: free
    region: oregon
    databaseName: alphanse_db
    user: alphanse_user
